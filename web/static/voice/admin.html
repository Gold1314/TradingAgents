<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TradingAgents — Voice Cost Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
      .panel { background: rgba(30, 41, 59, .6); border: 1px solid #334155; border-radius: 14px; padding: 1.25rem; }
      .stat-num { font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body class="min-h-screen">
    <main class="max-w-5xl mx-auto px-6 py-10 space-y-6">
      <header class="space-y-2">
        <h1 class="text-2xl font-semibold">Voice Cost Dashboard</h1>
        <p class="text-sm text-slate-400">
          Aggregated voice-conversational usage across all users. Backed by
          <code class="text-emerald-300">GET /api/voice/admin/cost-summary</code>
          (requires <code>STOCKAGENTS_ADMIN_PASSWORD</code>).
        </p>
      </header>

      <section class="panel space-y-3">
        <div class="flex flex-wrap items-end gap-3">
          <label class="flex flex-col text-xs text-slate-400">
            Admin password
            <input id="adminPwd" type="password" placeholder="STOCKAGENTS_ADMIN_PASSWORD"
                   class="mt-1 w-72 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
          </label>
          <label class="flex flex-col text-xs text-slate-400">
            Window (hours)
            <select id="hours" class="mt-1 w-32 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
              <option value="1">1</option>
              <option value="6">6</option>
              <option value="24" selected>24</option>
              <option value="168">168 (7d)</option>
            </select>
          </label>
          <button id="refresh"
                  class="px-4 py-2 rounded-lg bg-emerald-500/20 border border-emerald-500/60 text-emerald-200 hover:bg-emerald-500/30 text-sm font-medium">
            Refresh
          </button>
          <span id="status" class="text-xs text-slate-500 ml-auto"></span>
        </div>
      </section>

      <section class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="panel">
          <div class="text-xs uppercase tracking-wide text-slate-500">Sessions</div>
          <div id="kpiSessions" class="stat-num text-3xl font-semibold mt-2">—</div>
        </div>
        <div class="panel">
          <div class="text-xs uppercase tracking-wide text-slate-500">Voice minutes</div>
          <div id="kpiMinutes" class="stat-num text-3xl font-semibold mt-2">—</div>
        </div>
        <div class="panel">
          <div class="text-xs uppercase tracking-wide text-slate-500">Cost (USD)</div>
          <div id="kpiCost" class="stat-num text-3xl font-semibold mt-2 text-amber-300">—</div>
        </div>
      </section>

      <section class="panel">
        <h2 class="text-sm uppercase tracking-wide text-slate-400 mb-3">By agent</h2>
        <table class="w-full text-sm">
          <thead class="text-xs uppercase tracking-wide text-slate-500 border-b border-slate-700">
            <tr>
              <th class="text-left py-2">Agent</th>
              <th class="text-right py-2">Sessions</th>
              <th class="text-right py-2">Minutes</th>
              <th class="text-right py-2">Cost (USD)</th>
              <th class="text-right py-2">Avg $/session</th>
            </tr>
          </thead>
          <tbody id="byAgentBody">
            <tr><td colspan="5" class="text-slate-500 py-3 text-center">No data</td></tr>
          </tbody>
        </table>
      </section>
    </main>

    <script>
      /* eslint-disable no-undef */
      const STORAGE_KEY = "stockagents.voice.admin.pwd";
      const pwdEl = document.getElementById("adminPwd");
      pwdEl.value = sessionStorage.getItem(STORAGE_KEY) || "";

      function fmtMoney(n) {
        if (n == null) return "—";
        return "$" + (Number(n) || 0).toFixed(4);
      }
      function fmtMinutes(n) {
        if (n == null) return "—";
        const v = Number(n) || 0;
        return v < 60 ? v.toFixed(1) + " min" : (v / 60).toFixed(2) + " h";
      }
      function fmtInt(n) {
        return String(Math.round(Number(n) || 0));
      }

      async function refresh() {
        const pwd = (pwdEl.value || "").trim();
        const hours = document.getElementById("hours").value;
        const statusEl = document.getElementById("status");
        statusEl.textContent = "Loading…";
        try {
          const res = await fetch(`/api/voice/admin/cost-summary?hours=${hours}`, {
            headers: { "X-Admin-Password": pwd },
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(body.detail || `HTTP ${res.status}`);
          }
          const data = await res.json();
          sessionStorage.setItem(STORAGE_KEY, pwd);
          renderSummary(data);
          statusEl.textContent = `Updated ${new Date().toLocaleTimeString()}`;
        } catch (err) {
          statusEl.textContent = "Error: " + (err.message || err);
        }
      }

      function renderSummary(data) {
        document.getElementById("kpiSessions").textContent = fmtInt(data.sessions);
        document.getElementById("kpiMinutes").textContent = fmtMinutes(data.minutes);
        document.getElementById("kpiCost").textContent = fmtMoney(data.cost_usd);

        const tbody = document.getElementById("byAgentBody");
        tbody.innerHTML = "";
        const rows = data.by_agent || [];
        if (!rows.length) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-slate-500 py-3 text-center">No data</td></tr>`;
          return;
        }
        for (const r of rows) {
          const avg = r.sessions > 0 ? r.cost_usd / r.sessions : 0;
          const tr = document.createElement("tr");
          tr.className = "border-b border-slate-800";
          tr.innerHTML =
            `<td class="py-2">${r.agent_id}</td>` +
            `<td class="py-2 text-right stat-num">${fmtInt(r.sessions)}</td>` +
            `<td class="py-2 text-right stat-num">${fmtMinutes(r.minutes)}</td>` +
            `<td class="py-2 text-right stat-num">${fmtMoney(r.cost_usd)}</td>` +
            `<td class="py-2 text-right stat-num">${fmtMoney(avg)}</td>`;
          tbody.appendChild(tr);
        }
      }

      document.getElementById("refresh").addEventListener("click", refresh);
      document.getElementById("hours").addEventListener("change", refresh);
      pwdEl.addEventListener("keydown", (e) => { if (e.key === "Enter") refresh(); });
      // Auto-refresh on load if a password is cached.
      if (pwdEl.value) refresh();
    </script>
  </body>
</html>
